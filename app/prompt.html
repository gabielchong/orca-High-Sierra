<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orca HS</title>
<style>
  body { font: 14px -apple-system, sans-serif; padding: 24px; background: #111; color: #eee; max-width: 760px; }
  input { width: 100%; padding: 8px; font-size: 13px; box-sizing: border-box; }
  button { padding: 8px 16px; font-size: 13px; }
  #err { color: #f66; min-height: 1.2em; }
  code { background: #222; padding: 1px 4px; }
  .dim { opacity: .6 }
</style>
</head>
<body>
<h2>Orca High Sierra client</h2>
<p>Paste one of the following, then press Connect:</p>
<ul class="dim">
  <li><code>orca://pair?code=…</code> from Settings → Remote Orca Servers → Pair another Orca client</li>
  <li>the browser URL printed by <code>orca serve</code></li>
  <li>a server URL you already paired with, e.g. <code>http://192.0.2.10:6768/</code></li>
</ul>
<input id="u" placeholder="orca://pair?code=…" autofocus>
<p><button id="go">Connect</button> <span id="err"></span></p>
<p class="dim" id="ver"></p>
<script src="pair-link.js"></script>
<script>
  const input = document.getElementById('u')
  const err = document.getElementById('err')
  function connect() {
    const r = OrcaHsPairLink.resolvePairInput(input.value)
    if (r.error) { err.textContent = r.error; return }
    if (r.scope && r.scope !== 'runtime') { err.textContent = `pairing scope is "${r.scope}", expected "runtime"`; return }
    err.textContent = ''
    location.href = r.url
  }
  document.getElementById('go').onclick = connect
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect() })
  document.getElementById('ver').textContent = navigator.userAgent.match(/Chrome\/[\d.]+/)?.[0] + ' · ' + navigator.platform
</script>
</body>
</html>
