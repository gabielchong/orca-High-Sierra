<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OrcaHS — server unreachable</title>
<style>
  body { font: 14px -apple-system, sans-serif; padding: 24px; background: #111; color: #eee; max-width: 760px; }
  button { padding: 8px 16px; font-size: 13px; margin-right: 8px; }
  code { background: #222; padding: 1px 4px; }
  .dim { opacity: .6 }
</style>
</head>
<body>
<h2>Cannot reach the Orca server</h2>
<p id="target"></p>
<p class="dim" id="detail"></p>
<p>
  <button id="retry">Retry now</button>
  <button id="change">Use another server</button>
  <span class="dim" id="auto"></span>
</p>
<ul class="dim">
  <li>Is the server Mac awake and Orca running there?</li>
  <li>Are both machines on the same network (or is the SSH tunnel up)?</li>
  <li>If the server was updated, pairing may need to be redone from Settings → Remote Orca Servers.</li>
</ul>
<script>
  const api = window.orcaHs
  const params = new URLSearchParams(location.hash.replace(/^#/, ''))
  const code = params.get('code') || ''
  const desc = params.get('desc') || ''
  document.getElementById('detail').textContent = [code, desc].filter(Boolean).join(' ')

  let hasServer = false
  async function init() {
    const state = api ? await api.state() : {}
    hasServer = !!(state && state.origin)
    document.getElementById('target').textContent = hasServer
      ? `Server: ${state.origin}${state.pending ? ' (first connection not completed yet)' : ''}`
      : 'No server selected.'
    tick()
  }
  const retry = () => { if (api && hasServer) api.retry() }
  document.getElementById('retry').onclick = retry
  document.getElementById('change').onclick = () => { if (api) api.switchServer() }

  // The retry itself is done by the main process (same trusted target); this page only counts down.
  let seconds = 10
  const auto = document.getElementById('auto')
  function tick() {
    if (!hasServer) { auto.textContent = ''; return }
    if (seconds <= 0) { auto.textContent = 'retrying…'; retry(); seconds = 10; setTimeout(tick, 4000); return }
    auto.textContent = `auto-retry in ${seconds}s`
    seconds--
    setTimeout(tick, 1000)
  }
  init()
</script>
</body>
</html>
